version: 2

project_name: sloth

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: sloth
    main: ./cmd/sloth
    binary: sloth
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/ansonnchan/sloth/internal/buildinfo.version={{ .Version }}
      - -X github.com/ansonnchan/sloth/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/ansonnchan/sloth/internal/buildinfo.buildTime={{ .Date }}
      - -X github.com/ansonnchan/sloth/internal/buildinfo.dirty=false

archives:
  - id: sloth
    ids:
      - sloth
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '

release:
  prerelease: auto
